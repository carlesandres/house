version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # Dependabot opens PRs unassigned, so they miss every "assigned to me" view.
    assignees:
      - carlesandres
    groups:
      # Only publish.yml uses these and PR CI never runs it, so major bumps move as a pair.
      artifacts:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
        update-types:
          - major
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
    assignees:
      - carlesandres
    ignore:
      # Kept on the last published release so installs work before the next one exists.
      - dependency-name: "@carlesandres/house-*"
      # Overridden in pnpm-workspace.yaml to @opentui/core's exact peer; it moves with OpenTUI.
      - dependency-name: web-tree-sitter
    groups:
      # All npm security fixes in one PR instead of one per vulnerable package.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Effect and OpenTUI updates usually need code changes, so they don't block the rest.
      frameworks:
        patterns:
          - "effect"
          - "@effect/*"
          - "@opentui/*"
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
