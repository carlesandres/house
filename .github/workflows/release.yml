name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Release a new package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/house/package.json').version")"
          tag="v${version}"
          if ! [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable versions are released, not ${version}" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists. If it was never published, run:"
            echo "  gh workflow run publish.yml --ref ${tag}"
            exit 0
          fi
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          newest="$(printf '%s\n%s\n' "${latest#v}" "${version}" | sort -V | tail -n 1)"
          if [ "${newest}" != "${version}" ]; then
            echo "Package version ${version} is older than the latest tag ${latest}" >&2
            exit 1
          fi
          target="$(git log -1 --format=%H -G'"version":' -- apps/house/package.json)"
          target_version="$(git show "${target}:apps/house/package.json" |
            node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s).version))")"
          if [ "${target_version}" != "${version}" ]; then
            echo "Version commit ${target} has ${target_version}, expected ${version}" >&2
            exit 1
          fi
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' apps/house/CHANGELOG.md > "${notes}"
          if ! grep -q '[^[:space:]]' "${notes}"; then
            echo "apps/house/CHANGELOG.md has no notes under ## ${version}" >&2
            exit 1
          fi
          gh release create "${tag}" --target "${target}" --title "${tag}" --notes-file "${notes}"
          gh workflow run publish.yml --ref "${tag}"
          {
            echo "## ${tag} released"
            echo
            echo "The GitHub Release targets ${target}."
            echo "The publish workflow was dispatched for ${tag}."
          } >> "${GITHUB_STEP_SUMMARY}"

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.version.outputs.pr-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find pending changesets
        id: changesets
        run: |
          set -euo pipefail
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')"
          echo "pending=${pending}" >> "${GITHUB_OUTPUT}"

      - if: steps.changesets.outputs.pending != '0'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - if: steps.changesets.outputs.pending != '0'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.changesets.outputs.pending != '0'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or update the version pull request
        id: version
        if: steps.changesets.outputs.pending != '0'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  start-ci:
    needs: version
    if: needs.version.outputs.pr-number != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Start CI on the version pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref changeset-release/main

      - name: Request review from the owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.version.outputs.pr-number }}
        run: |
          set -euo pipefail
          involved="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --json reviewRequests,reviews \
            --jq "[.reviewRequests[].login, .reviews[].author.login] | index(\"${GITHUB_REPOSITORY_OWNER}\") != null" || true)"
          if [ "${involved}" = "true" ]; then
            exit 0
          fi
          gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --add-reviewer "${GITHUB_REPOSITORY_OWNER}" ||
            echo "::warning title=Review request failed::Request review on #${PR_NUMBER} by hand."
