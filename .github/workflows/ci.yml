name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run verify:github
      - run: bun run build:standalone
      - run: bun run --cwd apps/house smoke:file-navigator:standalone
      - run: bun run npm:pack

  npm-install-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.2, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Build npm tarball
        run: |
          bun run build:standalone linux-x64
          bun run build:npm-packages linux-x64
          bun run build:npm-main
          npm pack ./apps/house/dist/npm/binaries/linux-x64 --pack-destination .
          npm pack ./apps/house/dist/npm/main --pack-destination .
      - name: Enforce engine compatibility
        run: npm config set engine-strict true
      - name: Global install smoke test from tarball
        run: |
          version="$(node -p "require('./apps/house/package.json').version")"
          npm install -g \
            "./carlesandres-house-linux-x64-${version}.tgz" \
            "./carlesandres-house-${version}.tgz" \
            --omit=optional \
            --prefix "${RUNNER_TEMP}/npm-global"
          test "$("${RUNNER_TEMP}/npm-global/bin/house" --version)" = "${version}"
          HOUSE_FILE_NAVIGATOR_SMOKE_BINARY="${RUNNER_TEMP}/npm-global/bin/house" \
            bun run --cwd apps/house smoke:file-navigator:installed
