name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The required checks in main's ruleset. Runs started by workflow_dispatch aren't linked to the
  # version pull request, so release-status posts each of these as a commit status on its commit.
  RELEASE_REQUIRED_CHECKS: |-
    check
    npm-install-smoke (22.0.0)
    npm-install-smoke (26)
    smoke darwin-arm64
    smoke darwin-x64
    smoke linux-arm64
    smoke linux-x64

jobs:
  release-status-pending:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'changeset-release/main'
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark release CI as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t contexts <<< "${RELEASE_REQUIRED_CHECKS}"
          for context in "${contexts[@]}"; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=pending \
              -f context="${context}" \
              -f description="Release CI is running" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done

  changeset:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remind about a missing changeset
        run: |
          set -euo pipefail
          changed="$(git diff --name-only --diff-filter=d HEAD^1 HEAD)"
          if grep -Ev '^\.changeset/README\.md$' <<< "${changed}" |
            grep -Eq '^\.changeset/[^/]+\.md$'; then
            exit 0
          fi
          if grep -Eq '^(apps/house|packages/[^/]+)/src/' <<< "${changed}"; then
            message="This PR changes shipped source but adds no .changeset/*.md file."
            message="${message} Add one with 'bun run changeset' if users will notice."
            echo "::warning title=No changeset::${message}"
            echo "> [!WARNING]"$'\n'"> ${message}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  version-pr-scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'changeset-release/main') ||
      (github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Limit the version pull request to release files
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          if [ "$(git rev-list --count "${base}..HEAD")" != 1 ]; then
            echo "::error::The version pull request must be a single commit on main."
            exit 1
          fi
          allowed=$'^(D\t\\.changeset/[^/]+\\.md|M\tapps/house/CHANGELOG\\.md|M\tapps/house/package\\.json)$'
          changes="$(git diff --name-status "${base}" HEAD)"
          unexpected="$(grep -Ev "${allowed}" <<< "${changes}" || true)"
          readme="$(grep -E $'^D\t\\.changeset/README\\.md$' <<< "${changes}" || true)"
          unexpected="$(printf '%s\n%s' "${unexpected}" "${readme}" | sed '/^$/d')"
          if [ -n "${unexpected}" ]; then
            echo "::error::The version pull request changes files outside the release:"
            echo "${unexpected}"
            exit 1
          fi
          lines="$(git diff -U0 "${base}" HEAD -- apps/house/package.json | grep -E '^[-+][^-+]' || true)"
          version_line='^[-+]\s*"version": "[0-9]+\.[0-9]+\.[0-9]+",$'
          changed="$(grep -Ev "${version_line}" <<< "${lines}" || true)"
          if [ -n "${changed}" ] || [ "$(grep -Ec '^-' <<< "${lines}")" != 1 ] ||
            [ "$(grep -Ec '^\+' <<< "${lines}")" != 1 ]; then
            echo "::error::apps/house/package.json may change only its version:"
            echo "${lines}"
            exit 1
          fi

  check:
    needs: version-pr-scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the version pull request scope check
        if: needs.version-pr-scope.result == 'failure'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Audit shipped dependencies
        env:
          HOUSE_AUDIT_BLOCKING: >-
            ${{ github.ref_name == 'changeset-release/main' ||
              github.head_ref == 'changeset-release/main' }}
        run: bun run --cwd apps/house audit:shipped
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/house
      - run: bun run test:preview
      - run: bun run test:pty
      - run: bun run verify:github
      - run: bun run build:standalone
      - run: bun run --cwd apps/house smoke:preview:artifact standalone
      - run: bun run --cwd apps/house smoke:file-navigator:standalone
      - run: bun run npm:pack

  npm-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node in apps/house/package.json engines.node, and the newest.
        node-version: [22.0.0, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Build npm tarball
        run: |
          bun run build:standalone linux-x64
          bun run build:npm-packages linux-x64
          bun run build:npm-main
          npm pack ./apps/house/dist/npm/binaries/linux-x64 --pack-destination .
          npm pack ./apps/house/dist/npm/main --pack-destination .
      # Build with the repo's Node, then install and run with the Node under test.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enforce engine compatibility
        env:
          NODE_UNDER_TEST: ${{ matrix.node-version }}
        run: |
          case "$(node --version)" in
            "v${NODE_UNDER_TEST}" | "v${NODE_UNDER_TEST}".*) ;;
            *) echo "expected Node ${NODE_UNDER_TEST}, got $(node --version)"; exit 1 ;;
          esac
          npm config set engine-strict true
      - name: Global install smoke test from tarball
        run: |
          version="$(node -p "require('./apps/house/package.json').version")"
          npm install -g \
            "./carlesandres-house-linux-x64-${version}.tgz" \
            "./carlesandres-house-${version}.tgz" \
            --omit=optional \
            --prefix "${RUNNER_TEMP}/npm-global"
          test "$("${RUNNER_TEMP}/npm-global/bin/house" --version)" = "${version}"
          HOUSE_FILE_NAVIGATOR_SMOKE_BINARY="${RUNNER_TEMP}/npm-global/bin/house" \
            bun run --cwd apps/house smoke:file-navigator:installed
          HOUSE_PREVIEW_SMOKE_BINARY="${RUNNER_TEMP}/npm-global/bin/house" \
            bun run --cwd apps/house smoke:preview:artifact installed

  # Same targets and runners as publish.yml's build-binary, so a binary that breaks on one
  # platform fails the version pull request instead of the release.
  target-smoke:
    name: smoke ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: bun run build:standalone ${{ matrix.target }}
      - name: Run TUI startup and File Navigator mutation smoke on the standalone binary
        run: bun run --cwd apps/house smoke:file-navigator:standalone
      - run: bun run build:npm-packages ${{ matrix.target }}
      - run: bun run build:npm-main
      - name: Install the npm tarballs and run the same smoke on the installed house
        run: bun run --cwd apps/house smoke:file-navigator:installed

  release-status:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'changeset-release/main'
    needs: [version-pr-scope, check, npm-install-smoke, target-smoke]
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report release CI result
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.check.result }}
          INSTALL_RESULT: ${{ needs.npm-install-smoke.result }}
          SCOPE_RESULT: ${{ needs.version-pr-scope.result }}
          TARGET_RESULT: ${{ needs.target-smoke.result }}
        run: |
          state=failure
          description="Release CI failed"
          if [ "${CHECK_RESULT}" = "success" ] && [ "${INSTALL_RESULT}" = "success" ] &&
            [ "${SCOPE_RESULT}" = "success" ] && [ "${TARGET_RESULT}" = "success" ]; then
            state=success
            description="Release CI passed"
          fi
          mapfile -t contexts <<< "${RELEASE_REQUIRED_CHECKS}"
          for context in "${contexts[@]}"; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="${state}" \
              -f context="${context}" \
              -f description="${description}" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
