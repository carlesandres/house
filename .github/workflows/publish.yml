name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify manual publish ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              echo "Manual publish must run from main or a v* tag, not ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac

      - name: Verify the ref is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${main_sha}...${GITHUB_SHA}" \
            --jq .status)"
          case "${status}" in
            identical|behind) ;;
            *)
              echo "${GITHUB_SHA} is not on main (${status}); refusing to publish" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run verify:github

      - name: Verify release tag matches package version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./apps/house/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - run: bun run npm:pack

  build-binary:
    name: build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install --frozen-lockfile

      - name: Build standalone binary
        run: bun run build:standalone ${{ matrix.target }}

      - name: Run TUI startup and File Navigator mutation smoke
        run: bun run --cwd apps/house smoke:file-navigator:standalone

      - name: Package npm binary package
        run: bun run build:npm-packages ${{ matrix.target }}

      - name: Upload npm binary package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-binary-${{ matrix.target }}
          path: apps/house/dist/npm/binaries/${{ matrix.target }}/
          if-no-files-found: error

      - name: Upload release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball-${{ matrix.target }}
          path: apps/house/dist/release/house-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build-binary
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./apps/house/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Download npm binary packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-binary-*
          path: artifacts/npm-binaries

      - name: Restore binary permissions
        run: chmod 755 artifacts/npm-binaries/npm-binary-*/bin/house

      - name: Publish npm binary packages
        run: |
          set -euo pipefail
          main_version="$(node -p "require('./apps/house/package.json').version")"
          for package_dir in artifacts/npm-binaries/npm-binary-*; do
            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./${package_dir}/package.json').version")"
            if [ "${version}" != "${main_version}" ]; then
              echo "Version mismatch: ${name}=${version}, main=${main_version}" >&2
              exit 1
            fi
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published."
              continue
            fi
            echo "Publishing ${name}@${version} from ${package_dir}"
            npm publish "${package_dir}"
          done

      - run: bun run build:npm-main

      - run: npm pack --dry-run apps/house/dist/npm/main

      - name: Publish main npm package
        run: |
          set -euo pipefail
          name="$(node -p "require('./apps/house/package.json').name")"
          version="$(node -p "require('./apps/house/package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already published."
            exit 0
          fi
          npm publish apps/house/dist/npm/main

      - name: Download release tarballs
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-tarball-*
          path: apps/house/dist/release
          merge-multiple: true

      - name: Attach standalone binaries to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(apps/house/dist/release/house-*.tar.gz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release tarballs found under apps/house/dist/release" >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - name: Verify all npm packages
        id: npm
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/house/package.json').version")"
          packages=(
            @carlesandres/house
            @carlesandres/house-darwin-arm64
            @carlesandres/house-darwin-x64
            @carlesandres/house-linux-arm64
            @carlesandres/house-linux-x64
          )
          for attempt in $(seq 1 30); do
            missing=()
            for package in "${packages[@]}"; do
              published="$(npm view "${package}@${version}" version 2>/dev/null || true)"
              if [ "${published}" != "${version}" ]; then
                missing+=("${package}")
              fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              echo "All npm packages report ${version}."
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Packages still missing at ${version}: ${missing[*]}" >&2
              exit 1
            fi
            echo "Waiting for npm: ${missing[*]}"
            sleep 10
          done
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test the published install
        env:
          VERSION: ${{ steps.npm.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global "@carlesandres/house@${VERSION}" \
            --prefix "${RUNNER_TEMP}/house-release-smoke"
          actual="$("${RUNNER_TEMP}/house-release-smoke/bin/house" --version)"
          test "${actual}" = "${VERSION}"

      - name: Verify GitHub Release assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.npm.outputs.version }}
        run: |
          set -euo pipefail
          assets="$(gh release view "v${VERSION}" --json assets --jq '.assets[].name')"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            grep -Fxq "house-${target}.tar.gz" <<< "${assets}"
          done
          test "$(wc -l <<< "${assets}" | tr -d ' ')" -eq 4

      - name: Summarize verified release
        env:
          VERSION: ${{ steps.npm.outputs.version }}
        run: |
          {
            echo "## v${VERSION} verified"
            echo
            echo "All five npm packages report ${VERSION}."
            echo "The installed house binary reports ${VERSION}."
          } >> "${GITHUB_STEP_SUMMARY}"
